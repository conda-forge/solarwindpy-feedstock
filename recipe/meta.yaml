{% set name = "solarwindpy" %}
{% set version = "0.5.1" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/solarwindpy-{{ version }}.tar.gz
  sha256: a245cd7b199ad61fe345d07c0dc8dcd3362a739118aeeb0ef9a94cb8d3ac5008

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=77
    - wheel
    - setuptools-scm
    - pip
  run:
    - python >={{ python_min }},<4
    - numpy >=2.0,<3.0
    - scipy >=1.16
    - pandas >=3,<4
    - numexpr >=2.10.2
    - bottleneck >=1.4.2
    - pytables >=3.10.1
    - matplotlib-base >=3.11
    - astropy-base >=8
    - numba >=0.60
    - tabulate >=0.9
    - docstring-inheritance >=3.0,<4

test:
  imports:
    - solarwindpy
    - solarwindpy.core
    - solarwindpy.plotting
    - solarwindpy.fitfunctions
    - solarwindpy.instabilities
    - solarwindpy.solar_activity
    - solarwindpy.tools
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/blalterman/SolarWindPy
  summary: Python package for solar wind data analysis.
  description: |
    SolarWindPy provides tools for analyzing in-situ solar wind measurements,
    including multi-species plasma analysis, magnetic field calculations,
    and plasma instability studies.
  dev_url: https://github.com/blalterman/SolarWindPy
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - blalterman
